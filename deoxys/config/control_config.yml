CONTROL:
        SAFETY:
                # Per-joint torque limits (joints 1-7), in Nm. Applied every tick
                # (before libfranka's low-pass and rate limit) in the torque callback shared by ALL
                # controllers, so this bounds the commanded torque of JOINT_IMPEDANCE *and*
                # the OSC_* paths (OSC_POSE/POSITION/YAW) alike, not just feedforward. The
                # torque actually sent can exceed it briefly at a controller start/switch:
                # the low-pass blends toward it from the previous tau_J_d. Excludes gravity
                # (libfranka adds it), so cap + gravity must stay under the FR3 ceilings
                # (87 Nm j1-4 / 12 Nm j5-7); j5-7 at 8 Nm leave little margin. libfranka's
                # collision reflexes are no backstop here: franka_control_node.cpp sets
                # them at 100 Nm.
                # 10/5 Nm (IND-1807) saturated OSC_POSE with feedforward: joint 2 sat at
                # the clamp ~47% of a 2 Hz, 2 cm sine and ~14% of a teleop session.
                # j2/j4 briefly went to 60 Nm for full task inertia; reverted to 30 once
                # deoxys #22 and the decoupled OSC held teleop under 30 (2026-10-22).
                # A plain scalar is still accepted and broadcast to all 7 joints.
                MAX_TORQUE: [30, 30, 30, 30, 8, 8, 8]
                MIN_TORQUE: [-30, -30, -30, -30, -8, -8, -8]
                MAX_TRANS_SPEED: 0.1
                MIN_TRANS_SPEED: -0.1
                MAX_ROT_SPEED: 0.1
                MIN_ROT_SPEED: -0.1
